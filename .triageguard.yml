# Temporary live demo tunnel (will be restored to mcp.acme.example after demo triggers)
mcp_servers:
  jenkins:
    url: https://passes-calculate-citizen-gas.trycloudflare.com/mcp
    ci_source: jenkins
    auth_mode: oidc
    capabilities:
      get_failure_diagnostics: get_build_failure_cause
      rerun_build: trigger_rebuild
  circleci:
    url: https://passes-calculate-citizen-gas.trycloudflare.com/mcp/circleci
    ci_source: circleci
    auth_mode: oidc
    capabilities:
      get_failure_diagnostics: get_job_failure_cause
      rerun_build: rerun_workflow
  buildkite:
    url: https://passes-calculate-citizen-gas.trycloudflare.com/mcp/buildkite
    ci_source: buildkite
    auth_mode: oidc
    capabilities:
      get_failure_diagnostics: get_build_failure_cause
      rerun_build: rebuild_build
  azure_devops:
    url: https://passes-calculate-citizen-gas.trycloudflare.com/mcp/azure_devops
    ci_source: azure_devops
    auth_mode: oidc
    capabilities:
      get_failure_diagnostics: get_pipeline_failure_cause
      rerun_build: retry_stage
